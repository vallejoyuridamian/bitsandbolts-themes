<!doctype html>
<html lang="en" data-theme="dark" data-bb-theme-family="bitsandbolts" data-bb-theme-mode="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Canonical first-party Bits &amp; Bolts theme showcase.">
    <title>Bits &amp; Bolts Themes</title>
    <link rel="icon" type="image/svg+xml" sizes="any" href="./theme/brand/bitsandbolts/favicon.svg">
    <link rel="stylesheet" href="./theme/bitsandbolts/light.css">
    <link rel="stylesheet" href="./theme/bitsandbolts/dark.css">
    <link rel="stylesheet" href="./theme/bitsandbolts/scoped.css">
    <link rel="stylesheet" href="./theme/bitsandbolts/icons.css">
    <link rel="stylesheet" href="./theme/components/material-symbols.css">
    <link rel="stylesheet" href="./theme/components/typography.css">
    <link rel="stylesheet" href="./theme/components/button.css">
    <link rel="stylesheet" href="./theme/components/button-v2.css">
    <link rel="stylesheet" href="./theme/components/interface-primitives.css">
    <link rel="stylesheet" href="./theme/components/marketing.css">
    <link rel="stylesheet" href="./theme/components/selection-controls.css">
    <link rel="stylesheet" href="./theme/components/theme-gallery.css">
    <link rel="stylesheet" href="./theme/components/theme-showcase.css">
  </head>
  <body class="bb-theme-showcase">
    <header class="bb-theme-showcase__header">
      <img class="bb-theme-showcase__mark" src="./theme/brand/bitsandbolts/logo-cyan.webp" alt="">
      <span class="bb-theme-showcase__identity">
        <strong>Bits &amp; Bolts Themes</strong>
      </span>
      <button class="bb-theme-mode-toggle bb-interface-action" type="button" id="themeGalleryModeToggle" aria-label="Switch to light theme previews">
        <span class="ms" data-theme-gallery-mode-icon aria-hidden="true">light_mode</span>
      </button>
    </header>
    <main id="themeGallery" class="bb-theme-gallery bb-theme-showcase__gallery" aria-live="polite">
      <div class="bb-theme-gallery__loading" role="status">Loading first-party themes…</div>
    </main>
    <script type="module">
      import { createThemeGalleryController } from './theme/components/theme-gallery.js';

      const controller = createThemeGalleryController({
        catalogUrl: './theme/catalog.json',
        host: document.getElementById('themeGallery'),
        modeToggle: document.getElementById('themeGalleryModeToggle')
      });
      controller.render();
    </script>
  </body>
</html>
